server:
  port: 8084

spring:
  application:
    name: file-service
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:20MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:25MB}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:zola_file_db}
    username: ${DB_USER:zola}
    password: ${DB_PASSWORD:zola_pass}
  jpa:
    hibernate:
      ddl-auto: none

management:
  endpoints:
    web:
      exposure:
        include: health,info

storage:
  access-key: ${AWS_ACCESS_KEY:}
  secret-key: ${AWS_SECRET_KEY:}
  bucket: ${S3_BUCKET:zola-shared-files-dev}
  region: ${AWS_REGION:ap-southeast-1}

media:
  # 50 MB for images, 500 MB for videos, 100 MB for documents
  max-image-bytes: ${MEDIA_MAX_IMAGE_BYTES:52428800}
  max-video-bytes: ${MEDIA_MAX_VIDEO_BYTES:524288000}
  max-file-bytes: ${MEDIA_MAX_FILE_BYTES:104857600}
  # How long presigned PUT URLs are valid (minutes)
  presign-ttl-minutes: ${MEDIA_PRESIGN_TTL_MINUTES:15}
  cleanup:
    # How often the orphan cleanup scheduler runs (ms) — default 1 hour
    interval-ms: ${MEDIA_CLEANUP_INTERVAL_MS:3600000}
    # Initial delay before first run (ms) — default 5 minutes
    initial-delay-ms: ${MEDIA_CLEANUP_INITIAL_DELAY_MS:300000}
