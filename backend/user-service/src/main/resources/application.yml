server:
  port: 8082

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:zola_user_db}
    username: ${DB_USER:zola}
    password: ${DB_PASSWORD:zola_pass}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:redis_pass}
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  chat-service:
    base-url: ${CHAT_SERVICE_URL:http://chat-service:8083}