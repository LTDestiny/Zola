server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:redis_pass}

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET:dev-secret-key-dev-secret-key-dev-secret-key-12345}
  issuer: zola-auth-service

services:
  auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  user-url: ${USER_SERVICE_URL:http://localhost:8082}
  chat-url: ${CHAT_SERVICE_URL:http://localhost:8083}
  file-url: ${FILE_SERVICE_URL:http://localhost:8084}
