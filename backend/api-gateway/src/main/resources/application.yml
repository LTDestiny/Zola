server:
  port: 18080
  ssl:
    enabled: ${API_GATEWAY_SSL_ENABLED:false}
    key-store: ${API_GATEWAY_SSL_KEY_STORE:}
    key-store-password: ${API_GATEWAY_SSL_KEY_STORE_PASSWORD:}
    key-store-type: ${API_GATEWAY_SSL_KEY_STORE_TYPE:PKCS12}
  error:
    include-message: always

spring:
  application:
    name: api-gateway
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:20MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:25MB}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:redis_pass}

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET:dev-secret-key-dev-secret-key-dev-secret-key-12345}
  issuer: zola-auth-service

services:
  auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  user-url: ${USER_SERVICE_URL:http://localhost:8082}
  chat-url: ${CHAT_SERVICE_URL:http://localhost:8083}
  file-url: ${FILE_SERVICE_URL:http://localhost:8084}
  ai-url: ${AI_SERVICE_URL:http://localhost:8085}
