server:
  port: 8081
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:zola_identity_db}
    username: ${DB_USER:zola}
    password: ${DB_PASSWORD:zola_pass}
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:noreply@zola.app}
    password: ${SMTP_PASSWORD:replace_me}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:redis_pass}
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    baseline-on-migrate: true

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET:dev-secret-key-dev-secret-key-dev-secret-key-12345}
  issuer: zola-auth-service
  access-token-expiry-seconds: 900
  refresh-token-expiry-seconds: 604800

services:
  chat-url: ${CHAT_SERVICE_URL:http://chat-service:8083}

security:
  otp:
    max-attempts-per-hour: 5
    resend-delay-seconds: 60
    max-fail-attempts: 3
    lock-duration-minutes: 15
    ttl-seconds: 600
    hash-salt: ${OTP_HASH_SALT:change-this-otp-salt}

app:
  session:
    same-platform-policy: ${SAME_PLATFORM_SESSION_POLICY:REVOKE}
  mail:
    from: ${MAIL_FROM:${SMTP_USER:noreply@zola.app}}
