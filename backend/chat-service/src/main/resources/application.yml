server:
  port: 8083

spring:
  application:
    name: chat-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${CHAT_DB_NAME:zola_chat_db}
    username: ${DB_USER:zola}
    password: ${DB_PASSWORD:zola_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/zola_chat_db}
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:redis_pass}

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET:dev-secret-key-dev-secret-key-dev-secret-key-12345}
  issuer: zola-auth-service

app:
  ssl:
    enabled: ${CHAT_SERVICE_SSL_ENABLED:false}
    port: ${CHAT_SERVICE_SSL_PORT:18443}
    key-store: ${CHAT_SERVICE_SSL_KEY_STORE:}
    key-store-password: ${CHAT_SERVICE_SSL_KEY_STORE_PASSWORD:}
    key-store-type: ${CHAT_SERVICE_SSL_KEY_STORE_TYPE:PKCS12}
  services:
    auth-url: ${AUTH_SERVICE_URL:http://auth-service:8081}
    user-url: ${USER_SERVICE_URL:http://user-service:8082}
  chat:
    edit-window-seconds: ${CHAT_EDIT_WINDOW_SECONDS:900}
    recall-window-seconds: ${CHAT_RECALL_WINDOW_SECONDS:86400}
