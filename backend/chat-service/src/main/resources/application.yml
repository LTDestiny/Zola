server:
  port: 8083

spring:
  application:
    name: chat-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/zola_chat_db}
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:redis_pass}

management:
  endpoints:
    web:
      exposure:
        include: health,info