plugins { id 'com.android.application' }

android {
    namespace 'com.zola.mobilewebview'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zola.mobilewebview'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
}

def npmCommand = org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'npm.cmd' : 'npm'

tasks.register('buildWebAssets', Exec) {
    workingDir rootProject.projectDir
    commandLine npmCommand, 'run', 'build:web'
}

tasks.register('copyWebAssets', Exec) {
    workingDir rootProject.projectDir
    commandLine npmCommand, 'run', 'copy:web'
    dependsOn 'buildWebAssets'
}

tasks.named('preBuild') {
    dependsOn 'copyWebAssets'
}


dependencies { implementation 'androidx.webkit:webkit:1.6.1' }
