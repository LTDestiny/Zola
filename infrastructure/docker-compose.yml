services:
  kafka:
    profiles: ["eventing"]
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: 3
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-lc",
          "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-zolaadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-zolaadmin123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    profiles: ["local-pg-bootstrap"]
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-bootstrap:
    profiles: ["local-pg-bootstrap"]
    image: postgres:15-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - ./bootstrap/postgres-bootstrap.sh:/bootstrap/postgres-bootstrap.sh
    entrypoint:
      [
        "sh",
        "-c",
        "chmod +x /bootstrap/postgres-bootstrap.sh && /bootstrap/postgres-bootstrap.sh",
      ]
    restart: "no"

  mongo-bootstrap:
    image: mongo:7
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./bootstrap/mongo-seed.js:/bootstrap/mongo-seed.js
    entrypoint:
      ["mongosh", "mongodb://mongodb:27017", "/bootstrap/mongo-seed.js"]
    restart: "no"

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass redis_pass
    ports:
      - "6379:6379"

  coturn:
    profiles: ["realtime"]
    image: coturn/coturn
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf

  api-gateway:
    build:
      context: ../backend
      dockerfile: api-gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-dev-secret-key-dev-secret-key-12345}
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      CHAT_SERVICE_URL: http://chat-service:8083
      FILE_SERVICE_URL: http://file-service:8084
    depends_on:
      - auth-service
      - user-service
      - chat-service
      - file-service
      - redis

  auth-service:
    build:
      context: ../backend
      dockerfile: auth-service/Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_HOST: ${DB_HOST_DOCKER:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${AUTH_DB_NAME:-zola_identity_db}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-dev-secret-key-dev-secret-key-12345}
      CHAT_SERVICE_URL: http://chat-service:8083
      SAME_PLATFORM_SESSION_POLICY: ${SAME_PLATFORM_SESSION_POLICY:-REVOKE}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:-noreply@zola.app}
    depends_on:
      redis:
        condition: service_started

  user-service:
    build:
      context: ../backend
      dockerfile: user-service/Dockerfile
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      DB_HOST: ${DB_HOST_DOCKER:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${USER_DB_NAME:-zola_user_db}
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_started

  chat-service:
    build:
      context: ../backend
      dockerfile: chat-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      DB_HOST: ${DB_HOST_DOCKER:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      CHAT_DB_NAME: ${CHAT_DB_NAME:-zola_chat_db}
      MONGO_URI: ${CHAT_MONGO_URI:-mongodb://mongodb:27017/zola_chat_db}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-dev-secret-key-dev-secret-key-12345}
    depends_on:
      mongo-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_started

  call-service:
    profiles: ["extended"]
    build:
      context: ../backend
      dockerfile: call-service/Dockerfile
    ports:
      - "8087:8087"
    environment:
      DB_HOST: ${DB_HOST_DOCKER:-host.docker.internal}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      DB_NAME: ${CALL_DB_NAME:-zola_call_db}
      REDIS_HOST: redis
      TURN_SECRET: ${TURN_SECRET}
    depends_on:
      redis:
        condition: service_started

  file-service:
    build:
      context: ../backend
      dockerfile: file-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      DB_HOST: ${DB_HOST_DOCKER:-postgres}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${FILE_DB_NAME:-zola_file_db}
      S3_BUCKET: ${S3_BUCKET:-zola-shared-files-dev}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY:-zolaadmin}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY:-zolaadmin123}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
    depends_on:
      minio:
        condition: service_healthy

  ai-service:
    profiles: ["extended"]
    build:
      context: ../backend
      dockerfile: ai-service/Dockerfile
    ports:
      - "8085:8085"
    environment:
      DB_HOST: ${DB_HOST_DOCKER:-host.docker.internal}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      DB_NAME: ${AI_META_DB_NAME:-zola_ai_meta_db}
      MONGO_URI: ${AI_MONGO_URI:-mongodb://mongodb:27017/zola_ai_db}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      mongo-bootstrap:
        condition: service_completed_successfully

  notification-service:
    profiles: ["extended"]
    build:
      context: ../backend
      dockerfile: notification-service/Dockerfile
    ports:
      - "8086:8086"
    environment:
      REDIS_HOST: redis
      DB_HOST: ${DB_HOST_DOCKER:-host.docker.internal}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      DB_NAME: ${NOTIFICATION_DB_NAME:-zola_notification_db}
    depends_on:
      redis:
        condition: service_started

  admin-service:
    profiles: ["extended"]
    build:
      context: ../backend
      dockerfile: admin-service/Dockerfile
    ports:
      - "8088:8088"
    environment:
      DB_HOST: ${DB_HOST_DOCKER:-host.docker.internal}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      DB_NAME: ${ADMIN_DB_NAME:-zola_admin_db}

  zola-web:
    profiles: ["web"]
    build:
      context: ../frontend/web
      dockerfile: Dockerfile.prod
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:8080
      VITE_WS_URL: ws://localhost:8083/ws

volumes:
  postgres_data:
  mongo_data:
  minio_data:
