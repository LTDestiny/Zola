services:
  coturn:
    image: coturn/coturn
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf

  zola-web:
    build:
      context: ../frontend/web
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: https://192.168.11.195:18080
      VITE_WS_URL: wss://192.168.11.195:18443/ws
      VITE_HTTPS_KEY: /certs/192.168.11.195-key.pem
      VITE_HTTPS_CERT: /certs/192.168.11.195.pem
      VITE_WEBRTC_ICE_SERVERS: '[{"urls":["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]},{"urls":["turn:192.168.11.195:3478?transport=udp","turn:192.168.11.195:3478?transport=tcp"],"username":"zola","credential":"ZolaTurn@123"}]'
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ../frontend/web:/app
      - zola_web_node_modules:/app/node_modules
      - ../.devin/certs:/certs:ro

volumes:
  zola_web_node_modules:
  